<!DOCTYPE html>
<html>
<head>
  <title>yvan.rs - Publications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body { 
      font-family: "Segoe UI", Arial, sans-serif;
      color: #f5f5f5;
      background: #2a2a2a url('https://raw.githubusercontent.com/yvanrussell/yvanrussell.github.io/main/random_grey_variations.webp') repeat;
      background-size: 200px 200px;
      text-align: center;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
    }
    
    .handwritten-logo {
      width: clamp(300px, 65vw, 500px);
      height: auto;
      margin-bottom: 1rem;
      opacity: 0.85;
    }
    
    .content-box {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(42,42,42,0.9);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    
    h1 { 
      font-size: clamp(1.8rem, 5vw, 2.5rem); 
      color: #ffffff; 
      margin: 0 0 1rem; 
    }
    
    h2 { 
      color: #ffffff; 
      font-size: clamp(1.6rem, 4vw, 2rem);
      margin: 3rem 0 1.5rem 0;
      padding: 1rem 0;
      border-bottom: 3px solid #20B2AA;
      text-align: left;
      background: rgba(32,178,170,0.1);
      border-radius: 8px;
    }
    
    .year-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 2rem 0;
      padding: 1rem;
      background: rgba(74,85,104,0.5);
      border-radius: 12px;
      list-style: none;
    }
    
    .year-nav li {
      display: inline-block; 
      margin: 0.25rem; 
      background: rgba(74,85,104,0.8); 
      padding: clamp(0.75rem, 2vw, 1rem) clamp(1rem, 3vw, 1.5rem); 
      border-radius: 8px;
    }
    
    a { color: #20B2AA; text-decoration: none; }
    a:hover { color: #ffffff; }
    
    .publication {
      background: rgba(74,85,104,0.6);
      margin: 1.5rem 0;
      padding: 1.5rem;
      border-radius: 12px;
      border-left: 5px solid #20B2AA;
      text-align: left;
      line-height: 1.7;
      font-size: 0.95rem;
    }
